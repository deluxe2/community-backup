{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h1>Change your password</h1>

<section class="section">

<form method="post" action="{% url 'password_change' %}">
    {% csrf_token %}
    {{ form|crispy }}
<input class="button is-warning" type="submit" value="Change Password">
</form>
</section>

{% endblock %}
