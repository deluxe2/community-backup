{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

{% if form.errors %}
        {% for error in form.errors %}
<p>{{ error }}</p>
    {% endfor %}
{% endif %}

<form method="post" action="{% url 'register' %}">
    {% csrf_token %}
    {{ form|crispy }}
<input class="button is-primary" type="submit" value="Register">
</form>

{% endblock %}
