{% extends "base.html" %}

{% load crispy_forms_tags %}
{% block content %}
  <form method="post">
  {% csrf_token %}
  {{ form|crispy }}
    {% if form.initial %}
  <input class="button is-primary" type="submit" value="Save">
    {% else %}
  <input class="button is-primary" type="submit" value="Add">
    {% endif %}
  </form>
{% endblock %}
