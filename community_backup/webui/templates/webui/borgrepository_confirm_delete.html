{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<section class="section">
    <form method="post">{% csrf_token %}
        <p>Are you sure you want to delete "{{ object.name }}"?</p>
        {{ form }}
        <input class="button is-danger" type="submit" value="Confirm">
    </form>
</section>
{% endblock %}
